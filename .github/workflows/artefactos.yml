name: Persistir Relatório via artefactos entre Jobs
 
on:
   workflow_dispatch:

run-name: "Persistencia de Arquivos por @${{ github.actor }}"          


jobs:
  compilar:
    runs-on: ubuntu-latest
    outputs:
      token_validacao: ${{ steps.gerador.outputs.chave_checksum}}
    steps:
      - name: Criação dos arquivos
        run: |
          mkdir artefactos
          echo "Build efetuado com sucesso!" > ./artefactos/relatorio_1.txt
          echo "Build falhado!" > ./artefactos/relatorio_2.txt
        
      - name: Criação do Output de Texto
        id: gerador
        run: |
          echo "chave_checksum=VALIDADO-2026" >> $GITHUB_OUTPUT 

      - name: Carregamento dos arquivos
        uses: actions/upload-artifact@v7
        id: upload-artifact
        with:
          name: meu-artefacto
          path: ./artefactos 

      - name: Listagem dos arquivos 
        run: ls  

      - name: Endereço para obter os artefactos
        run: | 
          echo "${{ steps.upload-artifact.outputs.artifact_url}}"    

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - name: Fazer download dos arquivos
        uses: actions/download-artifact@v8
        with:
          name: meu-artefacto

      - name: Listagem dos arquivos 
        run: |
            ls
            echo "${{ needs.compilar.outputs.token_validacao}}"  