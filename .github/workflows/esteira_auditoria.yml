name: Auditoria Global Multi-Cloud

on:
  push:
    branches: [feature/**, release/**]
  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 23 * * 0'    

  workflow_dispatch:
    inputs:
      ambiente: 
        description: Selecione o ambiente
        required: true
        type: choice
        options:
          - desenvolvimento
          - teste
          - producao
      token_verificacao:
        description: Escreva a senha token
        required: true
        type: string

concurrency:
  group: ${{ github.workflow}}-${{github.ref}}
  cancel-in-progress: true

run-name: "${{github.event.inputs.ambiente}} Auditoria Global @${{github.actor}} via GATILHO-${{github.ref}} e versao-${{github.run_number}}"

jobs:
  gerar_relatorios:
    outputs:
      saida_1: ${{ steps.tuk_1.outputs.status_fase_1}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        nuvem: [aws, gcp]
    runs-on: ${{ matrix.os}}
    
    steps:
      - name: Criacao dos logs de auditoria
        run: |
          shell: bash
          echo "Relatorio Nuvem OK: ${{ matrix.nuvem}} em ${{ matrix.os}}" > log.txt

      - name: Upload Dinamico
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-${{matrix.os }}-${{matrix.nuvem}}
          path: log.txt

      - name: Exportacao Global
        id: tuk_1
        run: |
          echo "status_fase_1=MATRIZ-SUCESSO" >> $GITHUB_OUTPUT

  validar_tokens:
    needs: [gerar_relatorios] 
    if: github.event_name == 'workflow_dispatch' && success()
    runs-on: ubuntu-latest
    env:
      TOKEN_CORRETO: ${{ secrets.TOKEN_PRODUCAO }}
    steps:
      - name: Trava no step
        if: ${{inputs.ambiente != 'producao' || inputs.ambiente == 'producao' && inputs.token_verificacao == env.TOKEN_CORRETO}} 
        run: |
          echo "Token Validado com Sucesso"  

  deploy_ambientes:
    needs: [validar_tokens, gerar_relatorios]
    if: success()
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente}}
    steps:
      - name: Download do Artefacto
        uses: actions/download-artifact@v4
        with:
          path: pasta_geral_auditoria

      - name: Leitura Hibrida
        shell: bash
        run: |
          find ./pasta_geral_auditoria -type f -name "log.txt" | while read -r arquivo; do
            infra="$(basename $(dirname "$arquivo")")
            echo "Infra: $infra"
            cat "$arquivo"  
          done 
          echo "------------------------------"
          echo " Status: ${{ needs.gerar_relatorios.outputs.saida_1 }} " 

  alarme_falha:
    needs: [gerar_relatorios, validar_tokens, deploy_ambientes]
    if: failure() || cancelled()
    runs-on: ubuntu-latest 
    steps:
      - name: Notificacao de erros
        run: |
          echo "PANE NO SISTEMA: Auditoria abortada por falha crítica" 