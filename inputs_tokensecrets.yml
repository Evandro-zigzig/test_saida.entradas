name: Rollback de Emergência

run-name: "🚨 ROLLBACK EMERGENCIAL da versão: ${{ inputs.versao_antiga }}" 

on:
  workflow_dispatch:
    inputs:
      token_seguranca: 
        description: Escreva o token de validação
        required: true
        type: string

      versao_antiga: 
        description: Selecione a versão para restauro 
        required: true
        type: choice
        options:
          - v1
          - v2
          - v3

jobs: 
  executar_rollback:
    runs-on: ubuntu-latest
    steps: 
      - name: Validar Token e Iniciar Rollback
        if: inputs.token_seguranca == secrets.TOKEN_PRODUCAO 
        run: echo "Senha correta Sucesso"

      - name: Token incorreto não inicie o Rollback
        if: inputs.token_seguranca != secrets.TOKEN_PRODUCAO
        run: echo "Senha incorreta verifique e tente novamente"
