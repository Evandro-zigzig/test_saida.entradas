name: Pipeline Híbrido Multitarget

on:
 workflow_dispatch:
   inputs:
     ambiente_alvo:
       description: Seleciona o ambiente de execução
       type: choice
       options:
         - homologacao
         - producao
     token_seguranca:
        description: Escreva a chave
        type: string

run-name: " ${{ inputs.ambiente_alvo}} Deploy solicitado por @${{ github.actor}}"

jobs:
  build_job:
    outputs:
      versao_saida: ${{ steps.gerador_versao.outputs.versao_calculada}}
    runs-on: ubuntu-latest
    steps:
      - name: Criação do arquivo
        run: |
          mkdir pacote_codigo
          echo "Artefacto Compilado" > "pacote_codigo/app.zip"

      - name: Output de Texto
        id: gerador_versao
        run: echo "versao_calculada=v-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload de Arquivo
        uses: actions/upload-artifact@v7
        with:
          name: pacote_distribuicao
          path: ./pacote_codigo


  deploy_producao:
    runs-on: ubuntu-latest
    needs: build_job
    environment: producao  
    env: 
      TOKEN_VALIDO: ${{ secrets.TOKEN_PRODUCAO }}
    if: github.event.inputs.ambiente_alvo == 'producao' 
    steps:
      - name: Validação de Token com if
        if: github.event.inputs.token_seguranca == env.TOKEN_VALIDO         
        uses: actions/download-artifact@v8
        with:
          name: pacote_distribuicao
          path: . 

      - name: Exibição dos logs
        run: |
          cat pacote_codigo/app.zip 
          echo " ${{ needs.build_job.outputs.versao_saida}}" 